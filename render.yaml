# Demonstração temporária: somente planos gratuitos.
# Informe as URLs públicas efetivamente atribuídas pelo Render.
services:
  - type: web
    name: campusfacil-tcc-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run prisma:seed && npm start
    healthCheckPath: /api/categories
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campusfacil-tcc-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: EMAIL_DELIVERY
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
  - type: web
    name: campusfacil-tcc
    runtime: static
    buildCommand: cd frontend && npm ci --include=dev && npm run typecheck && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
databases:
  - name: campusfacil-tcc-db
    plan: free
    region: oregon
    databaseName: campusfacil
    user: campusfacil
    postgresMajorVersion: "16"
    ipAllowList: []
